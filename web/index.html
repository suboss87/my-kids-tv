<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>My Kids TV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<script>
  // The look the home screen last had, before anything is drawn, so a night start doesn't flash the day one first.
  try {
    if (localStorage.getItem('mykidstv.night') === 'true') {
      document.documentElement.style.background = '#121A43';
      document.body.className = 'night';
    }
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad dawn"></div>
    <div class="grad night"></div>
    <div class="stars"></div>
    <div class="sun"></div>
    <canvas id="bgA" width="48" height="27"></canvas>
    <canvas id="bgB" width="48" height="27"></canvas>
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="buttons"></div>
      <div id="window">
        <div class="art"></div>
        <div class="art"></div>
        <div class="scrim"></div>
        <div class="story"><div class="chip"></div><div class="name"></div><div class="meta"></div><div class="tag"></div><div class="cta"><span class="play"></span><span class="where"></span></div></div>
        <div class="dots"><b></b><b></b><b></b></div>
        <div id="cards"></div>
        <div class="rim"></div>
      </div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
    </div>
    <div id="platter"></div>
    <div id="tiles"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="catalog.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
